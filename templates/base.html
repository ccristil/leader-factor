<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LeaderFactor{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@1,300;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.1/dist/apexcharts.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="wordmark" href="{{ url_for('dashboard') }}" aria-label="LeaderFactor home">
        <img class="logo" src="{{ url_for('static', filename='img/lf-logotype-midnight.svg') }}" alt="LeaderFactor" width="960" height="161">
      </a>
      <div class="topbar__right">
        {% block topbar_right %}{% endblock %}
      </div>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="wrap" style="padding:0;">
      LeaderFactor — <em>behavior change</em>, made visible to the people who move it. Prototype.
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
